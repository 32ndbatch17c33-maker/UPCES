<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPCES - Server Core Hub</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0f1d">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --bg-canvas: #0a0f1d;
            --card-surface: rgba(30, 41, 59, 0.7);
            --text-obsidian: #f8fafc;
            --text-muted: #94a3b8;
            --xm-vivid-blue: #38bdf8;
            --xm-light-purple: #818cf8;
            --border-light: rgba(255, 255, 255, 0.08);
            --chat-bubble-peer: rgba(255, 255, 255, 0.05);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 12px 40px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 0 30px rgba(56, 189, 248, 0.15);
            --glow-blue: 0 0 15px rgba(56, 189, 248, 0.4);
            --glow-green: 0 0 15px rgba(52, 211, 153, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: radial-gradient(circle at top right, #1e1b4b, #020617); color: var(--text-obsidian); min-height: 100vh; padding: 30px; padding-bottom: 120px; }

        #entrance-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #020617;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000;
        }
        .netflix-title-clone {
            background: linear-gradient(135deg, var(--xm-vivid-blue), var(--xm-light-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 64px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase;
            filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.5));
            animation: netflixCinematic 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes netflixCinematic {
            0% { transform: scale(0.7); opacity: 0; filter: blur(8px); }
            40% { transform: scale(1); opacity: 1; filter: blur(0px); }
            100% { transform: scale(1.2); opacity: 0; filter: blur(15px); }
        }

        #gateway-screen { display: none; margin: 15vh auto; max-width: 450px; text-align: center; }
        .qualtrics-card-clone { background: var(--card-surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 40px; border-radius: 24px; box-shadow: var(--shadow-md), var(--shadow-lg); border: 1px solid rgba(255, 255, 255, 0.1); }
        .brand-logo-main { font-size: 42px; font-weight: 800; color: #ffffff; letter-spacing: -1.5px; }
        .brand-logo-sub { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--xm-vivid-blue), var(--xm-light-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(var(--glow-blue)); }
        .qualtrics-btn-blue { width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #4f46e5); color: #ffffff; border: none; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; margin-top: 25px; transition: all 0.3s ease; box-shadow: var(--shadow-sm); }
        .qualtrics-btn-blue:hover { transform: translateY(-2px); box-shadow: var(--glow-blue); opacity: 0.95; }

        .dashboard-wrapper { max-width: 1300px; margin: 0 auto; background: var(--card-surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 24px; padding: 40px; box-shadow: var(--shadow-md); border: 1px solid var(--border-light); display: none; }
        .header-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 26px; font-weight: 800; text-shadow: 0 0 15px rgba(255,255,255,0.1); }
        
        .btn-box { display: flex; gap: 12px; }
        .btn { padding: 11px 20px; font-weight: 600; border-radius: 10px; cursor: pointer; border: none; font-size: 13px; transition: all 0.2s; }
        .pdf-btn { background-color: #0284c7; color: white; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
        .pdf-btn:hover { box-shadow: var(--glow-blue); }
        .wipe-btn { background: transparent; border: 1px solid #f87171; color: #f87171; }
        .wipe-btn:hover { background: #ef4444; color: white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        
        .registration-panel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 35px; background: rgba(255, 255, 255, 0.03); padding: 24px; border-radius: 16px; border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        .form-control { padding: 12px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; font-size: 14px; outline: none; background: rgba(15, 23, 42, 0.6); color: #fff; transition: all 0.2s; }
        .form-control:focus { border-color: var(--xm-vivid-blue); box-shadow: var(--glow-blue); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; font-weight: 700; height: 44px; border-radius: 10px; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: all 0.2s; }
        .btn-success:hover { box-shadow: var(--glow-green); transform: translateY(-1px); }

        table { width: 100%; border-collapse: separate; border-spacing: 0; background: rgba(15, 23, 42, 0.4); border-radius: 16px; overflow: hidden; margin-top: 10px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); }
        th, td { padding: 16px; text-align: left; font-size: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        th { background-color: rgba(30, 41, 59, 0.9); color: #ffffff; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid rgba(255,255,255,0.1); }
        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.02); }
        .score-cell { font-weight: 800; color: var(--xm-vivid-blue); font-size: 15px; text-shadow: var(--glow-blue); }

        .fb-chat-trigger { position: fixed; bottom: 30px; right: 30px; width: 64px; height: 64px; background: linear-gradient(135deg, var(--xm-vivid-blue), var(--xm-light-purple)); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--glow-blue), 0 8px 32px rgba(0,0,0,0.3); z-index: 9999; border: 1px solid rgba(255,255,255,0.2); transition: transform 0.2s; }
        .fb-chat-trigger:hover { transform: scale(1.08); }
        .fb-chat-trigger svg { width: 28px; height: 28px; fill: #ffffff; }
        .fb-badge { position: absolute; top: -2px; right: -2px; width: 22px; height: 22px; background: #ef4444; border-radius: 50%; color: white; font-size: 11px; font-weight: bold; display: none; align-items: center; justify-content: center; border: 2px solid #0a0f1d; }
        
        .fb-chat-window { position: fixed; bottom: 110px; right: 30px; width: 380px; height: 500px; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 24px; box-shadow: var(--shadow-md), var(--glow-blue); border: 1px solid rgba(255, 255, 255, 0.15); display: none; flex-direction: column; z-index: 9999; overflow: hidden; }
        .fb-chat-header { background: rgba(15, 23, 42, 0.6); border-bottom: 1px solid rgba(255,255,255,0.1); color: white; padding: 16px 20px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
        .fb-chat-close { background: transparent; border: none; color: white; font-size: 22px; cursor: pointer; opacity: 0.8; }
        .fb-chat-close:hover { opacity: 1; }
        .fb-chat-body { flex: 1; padding: 20px; overflow-y: auto; background: rgba(10, 15, 29, 0.3); display: flex; flex-direction: column; gap: 12px; }
        
        .fb-msg { max-width: 80%; padding: 11px 15px; border-radius: 18px; font-size: 13px; line-height: 1.45; }
        .fb-msg.server { background: linear-gradient(135deg, #0284c7, #4f46e5); color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: var(--shadow-sm); }
        .fb-msg.scorer { background: var(--chat-bubble-peer); color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .fb-msg-meta { font-size: 10px; opacity: 0.65; margin-bottom: 3px; display: block; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        
        .fb-reactions-bar { display: flex; gap: 8px; padding: 6px 16px; background: rgba(15, 23, 42, 0.4); border-top: 1px solid rgba(255,255,255,0.05); align-items: center; }
        .fb-react-btn { font-size: 18px; background: none; border: none; cursor: pointer; transition: transform 0.1s; }
        .fb-react-btn:hover { transform: scale(1.25); }

        .fb-chat-footer { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.6); align-items: center; }
        .fb-chat-input { flex: 1; padding: 12px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; font-size: 14px; outline: none; background: rgba(10, 15, 29, 0.5); color: #fff; }
        .fb-chat-input:focus { border-color: var(--xm-vivid-blue); box-shadow: var(--glow-blue); }
        .fb-chat-send { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="entrance-screen"><div class="netflix-title-clone">UPCES</div></div>

    <div id="gateway-screen">
        <div class="qualtrics-card-clone">
            <div class="brand-logo-container"><span class="brand-logo-main">server</span><span class="brand-logo-sub">hub</span></div>
            <button class="qualtrics-btn-blue" onclick="revealOperationalDashboard()">Enter Server Dashboard</button>
        </div>
    </div>

    <button class="fb-chat-trigger" onclick="toggleFbChat()"><div class="fb-badge" id="chatBadge">0</div><svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.145 2 11.257c0 2.914 1.46 5.518 3.753 7.185V22l3.328-1.824c.91.252 1.87.39 2.863.39 5.523 0 10-4.145 10-9.257C22 6.145 17.523 2 12 2zm1 13h-2v-2h2v2zm0-4h-2V7h2v4z"/></svg></button>
    <div class="fb-chat-window" id="fbChatWindow">
        <div class="fb-chat-header"><span>Global Broadcast Stream</span><button class="fb-chat-close" onclick="toggleFbChat()">&times;</button></div>
        <div class="fb-chat-body" id="fbChatBody"></div>
        <div class="fb-reactions-bar">
            <button class="fb-react-btn" onclick="sendQuickEmoji('❤️')">❤️</button>
            <button class="fb-react-btn" onclick="sendQuickEmoji('👏')">👏</button>
            <button class="fb-react-btn" onclick="sendQuickEmoji('👍')">👍</button>
            <button class="fb-react-btn" onclick="sendQuickEmoji('😊')">😊</button>
        </div>
        <div class="fb-chat-footer">
            <input type="text" id="fbServerMsg" class="fb-chat-input" placeholder="Aa" onkeydown="if(event.key==='Enter') transmitBroadcast()">
            <button class="fb-chat-send" onclick="transmitBroadcast()">Send</button>
        </div>
    </div>

    <div class="dashboard-wrapper" id="main-ui">
        <div class="header-controls">
            <h1>UPCES Master Summary Output Engine</h1>
            <div class="btn-box">
                <button class="btn pdf-btn" onclick="triggerMasterPDFExport()">Export Data Matrix</button>
                <button class="btn wipe-btn" onclick="executeSystemWipe()">Wipe Central Database</button>
            </div>
        </div>

        <div class="registration-panel">
            <div class="form-group"><label>Team Number</label><input type="text" id="regTeamNum" class="form-control" placeholder="E.g., 01"></div>
            <div class="form-group"><label>Team/Contestant Title</label><input type="text" id="regTeamName" class="form-control" placeholder="E.g., Alpha Squad"></div>
            <div class="form-group"><label>Assigned Passkey</label><input type="text" id="regPasskey" class="form-control" placeholder="Secure Assignment Pass"></div>
            <button class="btn-success" onclick="commitContestantProfile()">Register Profile</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th rowspan="2" style="width: 6%; text-align: center;">Rank</th>
                    <th rowspan="2" style="width: 26%;">Registered Profile Title</th>
                    <th rowspan="2" style="width: 16%;">Scorer Account</th>
                    <th colspan="3" style="text-align: center; background: rgba(30, 41, 59, 0.4);">Easy Round</th>
                    <th colspan="3" style="text-align: center; background: rgba(30, 41, 59, 0.4);">Average Round</th>
                    <th colspan="3" style="text-align: center; background: rgba(30, 41, 59, 0.4);">Difficult Round</th>
                    <th rowspan="2" style="width: 12%; text-align: center;">Total Score</th>
                    <th rowspan="2" style="width: 8%; text-align: center;">Actions</th>
                </tr>
                <tr>
                    <th>C</th><th>W</th><th>N</th><th>C</th><th>W</th><th>N</th><th>C</th><th>W</th><th>N</th>
                </tr>
            </thead>
            <tbody id="liveGridBody"></tbody>
        </table>
    </div>

    <script>
        const CLOUD_TARGET_URL = "https://lomhji-default-rtdb.asia-southeast1.firebasedatabase.app";
        let localDataSetCache = [];
        let historicalMessageCount = 0;
        let isChatOpen = false;

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('entrance-screen').style.display = 'none';
                document.getElementById('gateway-screen').style.display = 'block';
            }, 2200);
        });

        function revealOperationalDashboard() {
            document.getElementById('gateway-screen').style.display = 'none';
            document.getElementById('main-ui').style.display = 'block';
            syncCloudDataNode();
            syncChatLogStream();
            setInterval(syncCloudDataNode, 2000);
            setInterval(syncChatLogStream, 2000);
        }

        function toggleFbChat() {
            const win = document.getElementById('fbChatWindow');
            isChatOpen = !isChatOpen;
            win.style.display = isChatOpen ? 'flex' : 'none';
            if(isChatOpen) {
                document.getElementById('chatBadge').style.display = 'none';
                document.getElementById('chatBadge').innerText = '0';
                setTimeout(() => { const b = document.getElementById('fbChatBody'); b.scrollTop = b.scrollHeight; }, 50);
            }
        }

        function playNotificationSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        async function syncCloudDataNode() {
            try {
                const res = await fetch(`${CLOUD_TARGET_URL}/competition_teams.json`);
                const fullNode = await res.json();
                const body = document.getElementById('liveGridBody');
                if(!fullNode) { body.innerHTML = `<tr><td colspan="14" style="text-align:center;color:gray;padding:30px;">No registered active records.</td></tr>`; return; }
                
                localDataSetCache = Object.keys(fullNode).map(k => ({ ...fullNode[k], _dbKey: k }));
                localDataSetCache.sort((a,b) => (b.totalScore || 0) - (a.totalScore || 0));

                body.innerHTML = localDataSetCache.map((team, idx) => `
                    <tr>
                        <td style="text-align:center;"><strong>#${idx+1}</strong></td>
                        <td><strong>Team ${team.teamNumber}: ${team.teamName}</strong><br><small style="color:var(--text-muted);">Passkey: ${team.passkey}</small></td>
                        <td><span style="font-weight:600;color:#ffffff;">${team.scorerName || '<em>Unassigned</em>'}</span></td>
                        <td>${team.breakdown?.easy?.c ?? 0}</td><td>${team.breakdown?.easy?.w ?? 0}</td><td>${team.breakdown?.easy?.n ?? 5}</td>
                        <td>${team.breakdown?.average?.c ?? 0}</td><td>${team.breakdown?.average?.w ?? 0}</td><td>${team.breakdown?.average?.n ?? 5}</td>
                        <td>${team.breakdown?.difficult?.c ?? 0}</td><td>${team.breakdown?.difficult?.w ?? 0}</td><td>${team.breakdown?.difficult?.n ?? 5}</td>
                        <td style="text-align:center;" class="score-cell">${team.totalScore || 0} pts</td>
                        <td style="text-align:center;"><button class="wipe-btn" style="padding:6px 10px; font-size:11px; border-radius:6px;" onclick="deleteProfileNode('${team._dbKey}')">Remove</button></td>
                    </tr>
                `).join('');
            } catch(e) { console.error(e); }
        }

        async function syncChatLogStream() {
            try {
                const res = await fetch(`${CLOUD_TARGET_URL}/competition_messages.json`);
                const logs = await res.json(); if(!logs) return;
                const keys = Object.keys(logs);
                
                if(keys.length > historicalMessageCount) {
                    if(historicalMessageCount > 0) {
                        playNotificationSound();
                        if(!isChatOpen) {
                            const badge = document.getElementById('chatBadge');
                            badge.style.display = 'flex';
                            badge.innerText = parseInt(badge.innerText || '0') + (keys.length - historicalMessageCount);
                        }
                    }
                    historicalMessageCount = keys.length;
                }

                const body = document.getElementById('fbChatBody');
                body.innerHTML = keys.map(k => {
                    const msg = logs[k]; const isServer = msg.sender === "SERVER ADMIN";
                    return `
                        <div class="fb-msg ${isServer ? 'server' : 'scorer'}">
                            <span class="fb-msg-meta">${msg.sender} • ${msg.time}</span>
                            ${msg.message}
                        </div>`;
                }).join('');
                if(isChatOpen) body.scrollTop = body.scrollHeight;
            } catch(e) { console.error(e); }
        }

        async function transmitBroadcast() {
            const input = document.getElementById('fbServerMsg'); const txt = input.value.trim(); if(!txt) return;
            executePushMsgPayload(txt); input.value = '';
        }

        async function sendQuickEmoji(emoji) {
            executePushMsgPayload(emoji);
        }

        async function executePushMsgPayload(messageText) {
            const packet = {
                sender: "SERVER ADMIN", message: messageText,
                time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
            };
            await fetch(`${CLOUD_TARGET_URL}/competition_messages.json`, { method: 'POST', body: JSON.stringify(packet) });
            syncChatLogStream();
        }

        async function commitContestantProfile() {
            const num = document.getElementById('regTeamNum').value.trim();
            const name = document.getElementById('regTeamName').value.trim();
            const key = document.getElementById('regPasskey').value.trim();
            if(!num || !name || !key) return alert("All profile tracking values required.");

            const dbSafeKey = "TEAM-" + num;
            const payload = {
                teamNumber: num, teamName: name, passkey: key, scorerName: "", totalScore: 0,
                breakdown: { easy: {c:0, w:0, n:5}, average: {c:0, w:0, n:5}, difficult: {c:0, w:0, n:5} },
                matrix: {
                    easy: { item1: "unanswered", item2: "unanswered", item3: "unanswered", item4: "unanswered", item5: "unanswered" },
                    average: { item1: "unanswered", item2: "unanswered", item3: "unanswered", item4: "unanswered", item5: "unanswered" },
                    difficult: { item1: "unanswered", item2: "unanswered", item3: "unanswered", item4: "unanswered", item5: "unanswered" }
                }
            };
            await fetch(`${CLOUD_TARGET_URL}/competition_teams/${dbSafeKey}.json`, { method: "PUT", body: JSON.stringify(payload) });
            document.getElementById('regTeamNum').value = ''; document.getElementById('regTeamName').value = ''; document.getElementById('regPasskey').value = '';
            syncCloudDataNode();
        }

        async function deleteProfileNode(dbKey) {
            if(confirm("Erase target team contestant record?")) {
                await fetch(`${CLOUD_TARGET_URL}/competition_teams/${dbKey}.json`, { method: 'DELETE' });
                syncCloudDataNode();
            }
        }

        async function executeSystemWipe() {
            if(confirm("Wipe entire environment core structure? This action cannot be undone.")) {
                await fetch(`${CLOUD_TARGET_URL}/.json`, { method: 'DELETE' });
                location.reload();
            }
        }

        function triggerMasterPDFExport() {
            if(localDataSetCache.length === 0) return alert("Empty database summary matrix.");
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            doc.text("UPCES SYSTEM MASTER SUMMARY REPORT", 14, 20);
            const body = localDataSetCache.map((t, i) => [`#${i+1}`, `Team ${t.teamNumber}: ${t.teamName}`, t.scorerName||'Unassigned', `${t.totalScore||0} pts`]);
            doc.autoTable({ head: [["Rank", "Profile Name", "Scorer Marshal", "Points Total"]], body, startY: 25 });
            doc.save("UPCES_Master_Leaderboard.pdf");
        }
    </script>
</body>
</html>
